# Board identity reported to software inside PiSandbox (via /proc/cpuinfo,
# /proc/device-tree and /sys/firmware/devicetree/base, generated at every launch
# by /usr/lib/pisandbox/prelaunch.sh). These strings exist only so that existing
# board-detection code (gpiozero, RPi.GPIO, pinout, scripts that grep cpuinfo)
# takes its normal code path. Edit and restart the app to change.
#
# Default: 4 GB "Model B" board, revision code c03115 (BCM2711, 4 GB, rev 1.5).
MODEL="Raspberry Pi 4 Model B Rev 1.5"
REVISION="c03115"
HARDWARE="BCM2835"
COMPATIBLE="raspberrypi,4-model-b brcm,bcm2711"
# Kernel flavour suffix appended to the phone's real kernel version for uname -r
KERNEL_SUFFIX="+rpt-rpi-v8"
