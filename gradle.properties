org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Public source repository: the ONE place the project URL is set. It is shown on the About screen and in the
# GPL written source offer (BuildConfig.PROJECT_URL). Docs, site/ and scripts/rootfs.lock carry the same URL as
# text; scripts/set-repo-owner.sh <owner> rewrites all of them and rebuilds. One-off override:
#   ./gradlew -Ppisandbox.projectUrl=https://example.org/pisandbox assembleRelease
pisandbox.projectUrl=https://github.com/pisandbox/pisandbox
